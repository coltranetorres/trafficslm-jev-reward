[project]
name = "trafficslm"
version = "0.1.0"
description = "How closely can a decision model (Jev) judge extraction outputs without seeing the gold label, and where does it break?"
authors = [
    { name = "Cole", email = "coltranetorres@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "pydantic>=2",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
